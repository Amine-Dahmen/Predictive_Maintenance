# Configuration Mosquitto (sans Docker)

# ---------- Réseau ----------
# Écoute sur toutes les interfaces locales
listener 1883 0.0.0.0

# ---------- Sécurité ----------
# Aucune connexion anonyme : chaque ESP32 et le backend ont un identifiant / mot de passe
allow_anonymous false
password_file mosquitto/config/passwd
acl_file mosquitto/config/acl

# ---------- Logs en direct dans la console ----------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ---------- Limites de protection ----------
max_packet_size 8192
max_inflight_messages 20

# ---------- Listener TLS (optionnel pour la production) ----------
# listener 8883
# cafile   mosquitto/config/certs/ca.crt
# certfile mosquitto/config/certs/server.crt
# keyfile  mosquitto/config/certs/server.key
# tls_version tlsv1.2
