# DevSecOps : secrets, analyse du code (SAST), dépendances (SCA), configuration et images (Trivy).
# Le dépôt est privé : sans GitHub Advanced Security, l'onglet « Code scanning » (CodeQL, envoi SARIF)
# n'est pas disponible. Les contrôles bloquants tournent donc en ligne de commande (Semgrep, Trivy) et
# CodeQL ne s'exécute que si le dépôt devient public.
name: Sécurité

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi : nouvelles vulnérabilités publiées dans la semaine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks, tout l'historique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (règles JavaScript, TypeScript, Python, Node.js, Dockerfile ; bloquant sur ERROR)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.184.0 semgrep scan \
            --config p/javascript --config p/typescript --config p/python --config p/nodejsscan --config p/dockerfile \
            --severity ERROR --exclude mobile --exclude tests --exclude '*.spec.ts' --metrics=off --error

  codeql:
    name: SAST (CodeQL, dépôt public uniquement)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  dependencies:
    name: Dépendances (npm audit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Backend (dépendances de production)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend (dépendances livrées dans l'application)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Service d'IA
        run: pip install pip-audit && pip-audit -r ml/requirements.txt

  dependency-review:
    name: Nouvelles dépendances de la pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }

  trivy:
    name: Configuration et Dockerfiles (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (vulnérabilités corrigeables, mauvaises configurations, secrets ; bloquant sur HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.2 fs --quiet \
            --db-repository public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db \
            --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs /src/mobile/build --skip-dirs /src/ml/data --exit-code 1 /src
