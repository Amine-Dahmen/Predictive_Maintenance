# Livraison continue : images Docker du backend, du web et du service d'IA.
# Pull request : construction + analyse Trivy (bloquante sur CRITICAL corrigeable).
# main / tag v* : publication sur GitHub Container Registry avec SBOM et attestation de provenance.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["backend/**", "frontend/**", "ml/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, ml]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/predimaint-${{ matrix.component }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Construction (image locale pour l'analyse)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Analyse de l'image (Trivy, bloquant sur CRITICAL corrigeable)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --quiet \
            --db-repository public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db \
            --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:scan"
      - name: Publication (SBOM + provenance)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
