# Mises à jour de sécurité et de versions proposées en pull request (testées par la CI avant fusion).
version: 2
updates:
  - { package-ecosystem: npm, directory: /backend, schedule: { interval: weekly }, groups: { backend: { patterns: ["*"], update-types: [minor, patch] } } }
  - { package-ecosystem: npm, directory: /frontend, schedule: { interval: weekly }, groups: { angular: { patterns: ["@angular/*", "@angular-devkit/*"] } } }
  - { package-ecosystem: pip, directory: /ml, schedule: { interval: weekly } }
  - { package-ecosystem: pub, directory: /mobile, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /backend, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /frontend, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /ml, schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
